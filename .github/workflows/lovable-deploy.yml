name: "Build e Deploy para KingHost (branch stable-website)"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Instalar dependencias"
        run: npm install

      # vite build (TanStack Start SPA) + scripts/postbuild.mjs
      # gera dist/ com index.html, 404.html, .htaccess, assets/ e imagens
      - name: "Build"
        run: npm run build

      - name: "Verificar dist/"
        run: |
          for f in index.html 404.html .htaccess; do
            test -f "dist/$f" || { echo "::error::dist/$f nao encontrado"; exit 1; }
          done
          test -d dist/assets || { echo "::error::dist/assets nao encontrado"; exit 1; }

      # O conteudo da branch stable-website vai direto para a pasta www/ da KingHost
      - name: "Deploy para a branch stable-website"
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stable-website
          folder: dist
          clean: true
